<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1</title>
    <style>
        body {
            text-align: center;
        }
        table {
            margin: 20px auto; 
            border-collapse: collapse;
            width: 400px;
            height: 400px;
        }
        td {
            border: 2px solid black;
        }
    </style>
</head>
<body>

    <a href="../index.html">Повернутись на головну</a>

    <table>
        <!-- Рядок 1 (Нове зовнішнє кільце зверху) -->
        <tr>
            <td colspan="8
        " style="background-color: turquoise; height: 40px;"></td>
        </tr>
        <!-- Рядок 2 -->
        <tr>
            <td rowspan="6" style="background-color: lightgoldenrodyellow; width: 40px;"></td>
            <td colspan="6" style="background-color: turquoise; height: 40px;"></td>
            <td rowspan="6" style="background-color: lightgoldenrodyellow; width: 40px;"></td>
        </tr>
        <!-- Рядок 3 -->
        <tr>
            <td rowspan="4" style="background-color: lightgoldenrodyellow; width: 40px;"></td>
            <td colspan="4" style="background-color: turquoise; height: 40px;"></td>
            <td rowspan="4" style="background-color: lightgoldenrodyellow; width: 40px;"></td>
        </tr>
        <!-- Рядок 4 (Центральні кольорові квадрати - верх) -->
        <tr>
            <td rowspan="2" style="background-color: lightgoldenrodyellow; width: 40px;"></td>
            <td style="background-color: red; width: 80px; height: 80px;"></td>
            <td style="background-color: blue; width: 80px;"></td>
            <td rowspan="2" style="background-color: lightgoldenrodyellow; width: 40px;"></td>
        </tr>
        <!-- Рядок 5 (Центральні кольорові квадрати - низ) -->
        <tr>
            <td style="background-color: lime; height: 80px;"></td>
            <td style="background-color: yellow;"></td>
        </tr>
        <!-- Рядок 6 -->
        <tr>
            <td colspan="4" style="background-color: turquoise; height: 40px;"></td>
        </tr>
        <!-- Рядок 7 -->
        <tr>
            <td colspan="6" style="background-color: turquoise; height: 40px;"></td>
        </tr>
        <!-- Рядок 8 (Нове зовнішнє кільце знизу) -->
        <tr>
            <td colspan="8" style="background-color: turquoise; height: 40px;"></td>
        </tr>
    </table>

</body>
</html>
