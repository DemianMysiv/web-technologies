<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 4 - Анкета HTML5</title>
    <style>
        .form-container {
            width: 70%;
            margin: 30px auto; 
            padding: 25px;
            background-color: #f4f7f6;
            border: 1px solid #ccc;
            font-family: Arial, sans-serif;
        }
        fieldset {
            margin-bottom: 25px;
            border: 2px solid #2c3e50;
            border-radius: 8px;
            padding: 20px;
        }
        legend {
            font-weight: bold;
            color: #2c3e50;
            background: #fff;
            padding: 0 10px;
            border: 1px solid #2c3e50;
            border-radius: 4px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="password"], input[type="email"], 
        input[type="tel"], input[type="date"], select, textarea, input[type="file"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        .inline-group label {
            font-weight: normal;
            display: inline;
            margin-right: 15px;
        }
        .buttons-group {
            text-align: center;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        button[type="submit"] { background-color: #27ae60; color: white; border: none; }
        button[type="reset"] { background-color: #e74c3c; color: white; border: none; }
    </style>
</head>
<body>

    <div style="text-align: center; margin-top: 20px;">
        <a href="../index.html" tabindex="1">Повернутись на головну</a>
    </div>

    <div class="form-container">
        <h2 style="text-align: center;">Анкета учасника ІТ-заходу</h2>
        
        <!-- 
            ДЕМОНСТРАЦІЯ МЕТОДІВ ПЕРЕДАЧІ ДАНИХ:
            1. Поточний метод GET: покаже всі введені дані (name=value) прямо в URL браузера (зручно для демонстрації викладачу).
            2. Метод POST для реальної відправки файлів: <form action="#" method="post" enctype="multipart/form-data">
        -->
        <form action="#" method="get">
            
            <!-- БЛОК 1: Особисті дані -->
            <fieldset>
                <legend>Особисті дані</legend>

                <div class="form-group">
                    <label for="fullname">Прізвище та Ім'я:</label>
                    <input type="text" id="fullname" name="fullname" value="" placeholder="Введіть ваше ПІБ" required tabindex="2">
                </div>
                
                <!-- Поле email: автозаповнення відключено, додано регулярний вираз -->
                <div class="form-group">
                    <label for="email">Електронна пошта:</label>
                    <input type="email" id="email" name="email" value="" placeholder="приклад: student@chnu.edu.ua" autocomplete="off" required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" title="Введіть коректний email (напр. user@mail.com)" tabindex="3">
                </div>

                <!-- Поле телефон: регулярний вираз для українських номерів -->
                <div class="form-group">
                    <label for="phone">Мобільний телефон:</label>
                    <input type="tel" id="phone" name="phone" value="" placeholder="+380991234567" required pattern="\+380[0-9]{9}" title="Формат: +380XXXXXXXXX" tabindex="4">
                </div>

                <!-- Поле пароль: рівно 6 символів, мін. 1 велика, 1 мала літера, 1 цифра -->
                <div class="form-group">
                    <label for="pass">Придумайте пароль:</label>
                    <input type="password" id="pass" name="pass" value="" placeholder="Пароль (6 символів: велика, мала літера та цифра)" required pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6}$" title="Пароль має складатися рівно з 6 символів, містити мінімум одну велику літеру, одну малу та одну цифру" tabindex="5">
                </div>

                <div class="form-group">
                    <label for="dob">Дата народження:</label>
                    <input type="date" id="dob" name="dob" value="" required tabindex="6">
                </div>
            </fieldset>

            <!-- БЛОК 2: Навчання та Навички -->
            <fieldset>
                <legend>Навчання та Навички</legend>

                <!-- Radio block 1 -->
                <div class="form-group inline-group">
                    <label>Освітній рівень:</label><br>
                    <input type="radio" id="edu_bachelor" name="education" value="bachelor" tabindex="7"> <label for="edu_bachelor">Бакалавр</label>
                    <input type="radio" id="edu_master" name="education" value="master" tabindex="8"> <label for="edu_master">Магістр</label>
                    <input type="radio" id="edu_phd" name="education" value="phd" tabindex="9"> <label for="edu_phd">Аспірант</label>
                </div>

                <!-- Radio block 2 (із checked за замовчуванням) -->
                <div class="form-group inline-group">
                    <label>Основний напрям розробки:</label><br>
                    <input type="radio" id="dir_front" name="direction" value="frontend" tabindex="10"> <label for="dir_front">Front-end</label>
                    <input type="radio" id="dir_back" name="direction" value="backend" checked tabindex="11"> <label for="dir_back">Back-end (активно за замовчуванням)</label>
                    <input type="radio" id="dir_full" name="direction" value="fullstack" tabindex="12"> <label for="dir_full">Full-stack</label>
                </div>

                <!-- Checkbox block (4 значення) -->
                <div class="form-group inline-group">
                    <label>Мови програмування (можна декілька):</label><br>
                    <input type="checkbox" id="tech_java" name="tech_java" value="yes" tabindex="13"> <label for="tech_java">Java</label>
                    <input type="checkbox" id="tech_cs" name="tech_cs" value="yes" tabindex="14"> <label for="tech_cs">C#</label>
                    <input type="checkbox" id="tech_js" name="tech_js" value="yes" tabindex="15"> <label for="tech_js">JavaScript</label>
                    <input type="checkbox" id="tech_py" name="tech_py" value="yes" tabindex="16"> <label for="tech_py">Python</label>
                </div>

                <!-- Випадний список (5 значень, 3-тє selected) -->
                <div class="form-group">
                    <label for="english">Рівень англійської мови:</label>
                    <select id="english" name="english" tabindex="17">
                        <option value="a1">A1 (Beginner)</option>
                        <option value="a2">A2 (Elementary)</option>
                        <option value="b1" selected>B1 (Intermediate) - за замовчуванням</option>
                        <option value="b2">B2 (Upper-Intermediate)</option>
                        <option value="c1">C1 (Advanced)</option>
                    </select>
                </div>

                <!-- Випадний список MULTIPLE (6 значень) -->
                <div class="form-group">
                    <label for="ide">Зручні IDE (Ctrl + клік для множинного вибору):</label>
                    <select id="ide" name="ide" multiple size="4" tabindex="18">
                        <option value="vscode">VS Code</option>
                        <option value="visualstudio">Visual Studio</option>
                        <option value="intellij">IntelliJ IDEA</option>
                        <option value="eclipse">Eclipse</option>
                        <option value="webstorm">WebStorm</option>
                        <option value="pycharm">PyCharm</option>
                    </select>
                </div>

                <!-- Випадний список OPTGROUP (4 групи по 3 значення) -->
                <div class="form-group">
                    <label for="subject">Улюблена дисципліна:</label>
                    <select id="subject" name="subject" tabindex="19">
                        <optgroup label="Програмування">
                            <option value="java">Конструювання ПЗ (Java)</option>
                            <option value="csharp">Конструювання ПЗ (C#)</option>
                            <option value="web">Веб-технології</option>
                        </optgroup>
                        <optgroup label="Системи">
                            <option value="os">Операційні системи</option>
                            <option value="networks">Комп'ютерні мережі</option>
                            <option value="arch">Архітектура ПК</option>
                        </optgroup>
                        <optgroup label="Аналітика">
                            <option value="req">Інженерія вимог</option>
                            <option value="db">Бази даних</option>
                            <option value="nosql">NoSQL-системи</option>
                        </optgroup>
                        <optgroup label="Загальні">
                            <option value="eng">Англійська мова</option>
                            <option value="math">Математика</option>
                            <option value="phil">Філософія</option>
                        </optgroup>
                    </select>
                </div>
            </fieldset>

            <!-- БЛОК 3: Додаткова інформація та файли -->
            <fieldset>
                <legend>Додаткова інформація</legend>

                <!-- Datalist -->
                <div class="form-group">
                    <label for="city">Місто проживання (виберіть або введіть своє):</label>
                    <input list="cities" id="city" name="city" value="" placeholder="Почніть вводити назву..." tabindex="20">
                    <datalist id="cities">
                        <option value="Чернівці">
                        <option value="Київ">
                        <option value="Львів">
                        <option value="Івано-Франківськ">
                        <option value="Тернопіль">
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="about">Додатковий коментар:</label>
                    <textarea id="about" name="about" rows="3" placeholder="Ваші очікування від заходу..." tabindex="21"></textarea>
                </div>

                <!-- Завантаження файлів (тільки аудіо, кілька файлів) -->
                <div class="form-group">
                    <label for="audio_upload">Завантажити аудіовізитку (лише аудіофайли, можна декілька):</label>
                    <input type="file" id="audio_upload" name="audio_files" accept="audio/*" multiple tabindex="22">
                </div>
            </fieldset>

            <!-- Кнопки Submit та Reset -->
            <div class="buttons-group">
                <button type="submit" tabindex="23">Відправити дані</button>
                <button type="reset" tabindex="24">Очистити форму</button>
            </div>

        </form>
    </div>

</body>
</html>
