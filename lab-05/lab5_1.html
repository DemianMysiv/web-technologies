<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна 5 - Завдання 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="travel-plan">
        <h1>План подорожі:</h1>
        
        <ul class="level-1">
            <!-- Перший головний пункт -->
            <li class="icon-main">
                <span class="span-level-1">Підготовчий етап</span>
                <ul class="level-2">
                    <li class="icon-route"><span class="span-level-2">Обрати маршрут</span></li>
                    <li class="icon-flight"><span class="span-level-2">Квитки на літак</span></li>
                    <li class="icon-hotel"><span class="span-level-2">Готель</span></li>
                    <li class="icon-car"><span class="span-level-2">Оренда авто</span></li>
                </ul>
            </li>
            
            <!-- Другий головний пункт -->
            <li class="icon-main">
                <span class="span-level-1">Відпочинок</span>
                <ul class="level-2">
                    <li class="icon-bar"><span class="span-level-2">Бари</span></li>
                    <li class="icon-casino"><span class="span-level-2">Казино</span></li>
                    <li class="icon-museum"><span class="span-level-2">Музеї</span></li>
                    <li class="icon-festival"><span class="span-level-2">Фестивалі</span></li>
                </ul>
            </li>
        </ul>
    </div>

</body>
</html>
