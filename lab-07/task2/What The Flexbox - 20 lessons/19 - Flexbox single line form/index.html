<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlexBox Form</title><link rel="stylesheet" href="style.css"></head>
<body><div class="cover"><form class="flex-form">
<input type="search" placeholder="Where do you want to go?" aria-label="Destination">
<label for="from">From</label><input type="date" name="from" id="from">
<label for="to">To</label><input type="date" name="to" id="to">
<select name="guests" aria-label="Guests"><option value="1">1 Guest</option><option value="2">2 Guest</option><option value="3">3 Guest</option><option value="4">4 Guest</option><option value="5">5 Guest</option></select>
<input type="submit" value="Search">
</form></div>
<!-- The original video background is shown in the screenshot; its external source is not archived. -->
</body></html>
